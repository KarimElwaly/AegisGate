[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisgate"
version = "0.1.0"
description = "Commercial-grade, domain-agnostic AI Guardrails & Governance Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AegisGate Core Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[asyncio]>=5.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "onnxruntime>=1.19.0",
    "pyjwt>=2.9.0",
    "click>=8.0.0",
    "sqlglot>=25.0.0",
]

[project.scripts]
aegisctl = "cli.aegisctl.main:cli"

[project.optional-dependencies]
cli = [
    "click>=8.0.0",
    "pyyaml>=6.0.2",
]
ml = [
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
]
oidc = [
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
]
kms = [
    "cryptography>=43.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "fakeredis>=2.25.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",   # Do not perform function call `Depends` in argument defaults
    "BLE001", # Do not catch blind exception `Exception`
    "DTZ003", # `datetime.datetime.utcnow()`
    "RUF012", # Mutable default value for class attribute
    "RUF059", # Unpacked variable is never used
    "F841",   # Local variable is assigned to but never used
    "TRY201", # Use `raise` without specifying exception name
    "S105",   # Possible hardcoded password
    "S106",   # Possible hardcoded password
    "S110",   # `try`-`except`-`pass` detected
    "S101",   # Use of `assert` detected
]
