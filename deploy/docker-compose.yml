version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisgate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegisgate
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_pass
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_user -d aegisgate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegisgate-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aegis_redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aegisgate-engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    container_name: aegisgate-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AEGIS_ENV: prod
      DATABASE_URL: postgresql+asyncpg://aegis_user:aegis_pass@postgres:5432/aegisgate
      REDIS_URL: redis://redis:6379/0
      AEGIS_SECRET_KEY: ${AEGIS_SECRET_KEY:-insecure-default-key-change-in-prod-123456}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3

  aegisgate-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
    container_name: aegisgate-dashboard
    restart: unless-stopped
    depends_on:
      aegisgate-engine:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: aegisgate-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aegis_promdata:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: aegisgate-otel-collector
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aegisgate-grafana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      - aegis_grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  aegis_pgdata:
  aegis_redisdata:
  aegis_promdata:
  aegis_grafanadata:
