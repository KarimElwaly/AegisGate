global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "aegisgate-pdp"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["aegisgate-engine:8000", "pdp-engine:8088"]
        labels:
          environment: "production"
          service: "aegisgate-guardrails"

  - job_name: "otel-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          environment: "production"
          service: "aegisgate-telemetry"

